name: Import Rumpel-Pumpel preview
on:
  push:
    paths:
      - 'scripts/import_rumpel_preview.py'
      - '.github/workflows/import-rumpel-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/import_rumpel_preview.py
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/rumpel-pumpel.webp
          git diff --staged --quiet || (git commit -m "Add Rumpel-Pumpel portfolio preview" && git push)
